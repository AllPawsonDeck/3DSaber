name: Build 3DSaber
on:
  push:
    branches: [ main ]
    paths:
      - 'beatsaber3ds/**'
      - 'README.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pil python3-pip curl unzip ca-certificates git gh
          if command -v dkp-pacman >/dev/null 2>&1; then dkp-pacman -S --noconfirm --needed citro2d citro3d; else pacman -S --noconfirm --needed citro2d citro3d; fi
          python3 -m pip install --break-system-packages qrcode

      - name: Install makerom and bannertool
        run: |
          curl -sSL -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip
          unzip -oj /tmp/makerom.zip -d /tmp/makerom
          install -m755 "$(find /tmp/makerom -type f -name makerom | head -n1)" /usr/local/bin/makerom
          curl -sSL -o /tmp/bannertool.zip https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          unzip -oj /tmp/bannertool.zip 'linux-x86_64/bannertool' -d /usr/local/bin
          chmod +x /usr/local/bin/bannertool

      - name: Generate uploaded icon and safe flat banner
        working-directory: beatsaber3ds
        run: |
          python3 tools/gen_assets.py
          python3 tools/gen_icon.py
          test -s icon.png
          test -s banner.png

      - name: Build native Old 3DS executable
        working-directory: beatsaber3ds
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export CTRULIB=/opt/devkitpro/libctru
          sed -i 's/static void shutdown(/static void appShutdown(/; s/ shutdown();return/ appShutdown();return/' source/main.c
          # Boot-first diagnostic: eliminate CSND as a possible launch hang.
          sed -i 's/audioOK=R_SUCCEEDED(csndInit()); if(audioOK)buildUiSound();/audioOK=false;/' source/main.c
          # Force one rendered menu frame before the event loop so we know main() was reached.
          sed -i 's/while(aptMainLoop()){/render(); while(aptMainLoop()){/' source/main.c
          make -j2
          test -f gpt-saber-3ds.elf
          test -f gpt-saber-3ds.3dsx

      - name: Package boot-first FBI CIA
        working-directory: beatsaber3ds
        run: |
          bannertool makesmdh -s 'GPT Saber 3DS' -l 'Old 3DS boot-first hardware test' -p '3DCreatorS + OpenAI' -f 'visible,recordusage' -i icon.png -o icon.icn
          bannertool makebanner -i banner.png -a banner.wav -o banner.bnr
          makerom -f cia -o gpt-saber-3ds.cia -elf gpt-saber-3ds.elf -rsf app.rsf -icon icon.icn -banner banner.bnr -exefslogo -target t
          test -s gpt-saber-3ds.cia
          makerom -i gpt-saber-3ds.cia || true

      - name: Generate FBI QR
        run: |
          python3 - <<'PY'
          import qrcode
          url='https://github.com/AllPawsonDeck/3DSaber/releases/download/gpt-saber-3ds-v0.1.2-bootfix/gpt-saber-3ds.cia'
          qrcode.make(url).save('gpt-saber-3ds-fbi-qr.png')
          PY
          test -s gpt-saber-3ds-fbi-qr.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpt-saber-3ds-old3ds-v012-bootfix
          path: |
            beatsaber3ds/gpt-saber-3ds.cia
            beatsaber3ds/gpt-saber-3ds.3dsx
            beatsaber3ds/icon.png
            gpt-saber-3ds-fbi-qr.png

      - name: Publish boot-fix prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: gpt-saber-3ds-v0.1.2-bootfix
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          NOTES='Old 3DS boot-first test by 3DCreatorS. Replaced the custom exheader with a broader proven homebrew-compatible syscall/process setup, removed the broken CGFX banner, and temporarily disabled CSND startup to isolate launch hangs. Uses the uploaded icon. If this reaches the game menu, the next build restores audio and then the corrected 3D HOME Menu model.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" beatsaber3ds/gpt-saber-3ds.cia beatsaber3ds/gpt-saber-3ds.3dsx beatsaber3ds/icon.png gpt-saber-3ds-fbi-qr.png --clobber
          else
            gh release create "$TAG" beatsaber3ds/gpt-saber-3ds.cia beatsaber3ds/gpt-saber-3ds.3dsx beatsaber3ds/icon.png gpt-saber-3ds-fbi-qr.png --target "$GITHUB_SHA" --title 'GPT Saber 3DS v0.1.2 boot fix' --prerelease --notes "$NOTES"
          fi
